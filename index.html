<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL Quest with Lumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>:root{
  --bg1:#fdf6ff; --bg2:#eef7ff; --ink:#3b3355; --muted:#7a7194; --card:#ffffffcc; --line:#ece4f7;
  --pink:#ffb8cf; --pink2:#ff8fb3; --peach:#ffd8c2; --mint:#bfeedd; --mint2:#7fd8b8; --sky:#c6e3ff; --sky2:#8cc4ff;
  --lav:#e1d4ff; --lav2:#b9a2ff; --butter:#fff1b8; --butter2:#ffd966; --coral:#ff9e8f;
  --shadow:0 10px 30px -12px rgba(120,90,180,.35); --r:22px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#f3fff9);min-height:100vh;overflow-x:hidden}
h1,h2,h3,.brand{font-family:'Baloo 2','Nunito',sans-serif;letter-spacing:.2px}
code,pre,textarea.editor,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
a{color:#7a5cff}
button{font-family:inherit;cursor:pointer}
/* floating bubbles */
.bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bubbles span{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(200,180,255,.25));border:1px solid rgba(185,162,255,.35);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(30px)}}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{font-size:26px;font-weight:800;display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none}
.brand b{background:linear-gradient(90deg,#ff7eb3,#9a7bff,#4fc3a1);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:6px;margin-left:10px}
.nav a{padding:7px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
.nav a.on,.nav a:hover{background:var(--lav);color:var(--ink)}
.stats{margin-left:auto;display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 2px 8px -4px rgba(120,90,180,.3)}
.pill.gem{background:linear-gradient(90deg,#fff,#fff4fb)}
.pill .bar{width:110px;height:10px;border-radius:9px;background:#f0eaf9;overflow:hidden}
.pill .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink2),var(--lav2),var(--mint2));border-radius:9px;transition:width .8s cubic-bezier(.2,.9,.3,1.2)}
.iconbtn{border:none;background:#fff;border:1px solid var(--line);width:36px;height:36px;border-radius:50%;font-size:16px}
.gem-bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.25) rotate(-6deg)}60%{transform:scale(.95)}}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 20px 80px}
.view{animation:fadeUp .5s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(6px);border:1px solid #fff;border-radius:var(--r);box-shadow:var(--shadow);padding:22px 26px;margin:18px 0}
.reveal{opacity:0;transform:translateY(24px);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center;padding:26px 34px;background:linear-gradient(135deg,#ffe3ee,#e9e2ff 55%,#dff6ff);border-radius:30px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:52px;line-height:1;margin:6px 0 10px}
.hero p{font-size:18px;color:#5b5278;max-width:520px}
.hero .sparkle{position:absolute;font-size:20px;animation:twinkle 2.4s infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6) rotate(40deg)}}
.btn{border:none;border-radius:16px;padding:12px 22px;font-weight:800;font-size:16px;background:linear-gradient(90deg,#ff8fb3,#b48cff);color:#fff;box-shadow:0 6px 0 #d46e98,0 12px 20px -8px rgba(180,100,200,.6);transition:transform .12s, box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d46e98}
.btn.mint{background:linear-gradient(90deg,#5fd3a8,#6cc7ff);box-shadow:0 6px 0 #3aa883,0 12px 20px -8px rgba(80,180,160,.6)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #e2d8f3;border:1px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px;border-radius:12px}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:not-allowed;transform:none}
.lumi-wrap{display:flex;justify-content:center}
.lumi{width:260px;max-width:100%;animation:bob 3.2s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(255,140,180,.35))}
.lumi.sm{width:92px;flex:none}
@keyframes bob{50%{transform:translateY(-12px) rotate(-2deg)}}
.lumi .gill{transform-origin:center;animation:wiggle 1.6s ease-in-out infinite}
.lumi .gill.r{animation-delay:.3s}
@keyframes wiggle{50%{transform:rotate(6deg)}}
.lumi .eye{animation:blink 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.lumi .gemglow{animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{opacity:.4}}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}
.stat{background:#fff;border-radius:20px;padding:16px 18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .n{font-family:'Baloo 2';font-size:32px;font-weight:800;line-height:1}
.stat .l{color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px}
/* map */
.map{position:relative;height:640px;margin-top:10px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--ink);width:130px;text-align:center}
.node .orb{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-family:'Baloo 2';font-weight:800;font-size:28px;border:4px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.06),var(--shadow);transition:transform .2s}
.node:hover .orb{transform:scale(1.1) rotate(-4deg)}
.node .t{font-weight:800;font-size:13px;line-height:1.15}
.node.locked .orb{background:#eee9f3 !important;color:#b8b0c8;filter:grayscale(1)}
.node.locked{cursor:not-allowed}
.node.current .orb{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,162,255,.7),var(--shadow)}70%{box-shadow:0 0 0 18px rgba(185,162,255,0),var(--shadow)}}
.node .done-star{position:absolute;top:-6px;right:24px;font-size:22px;animation:pop .5s}
.chest .orb{border-radius:18px;width:62px;height:62px;font-size:28px;background:linear-gradient(135deg,#ffe9a8,#ffc6d9)}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.role{border-radius:20px;padding:16px;border:1px solid #fff;box-shadow:var(--shadow);transition:transform .2s}
.role:hover{transform:translateY(-4px) rotate(-.5deg)}
.role h3{margin:6px 0 4px;font-size:18px}
.role p{font-size:13.5px;margin:0 0 8px;color:#5b5278}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{background:#ffffffaa;border-radius:8px;padding:2px 7px;font-size:12px;font-weight:800}
.chips span.ok{background:#fff;outline:2px solid var(--mint2)}
/* chapter */
.ch-head{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;border-radius:30px;padding:24px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.ch-head .art{width:150px;height:150px;animation:bob 4s ease-in-out infinite}
.ch-head h1{font-size:40px;margin:0;line-height:1.05}
.ch-head .kicker{font-weight:800;color:#6d5f8f;text-transform:uppercase;letter-spacing:1.4px;font-size:13px}
.ch-head .sub{font-size:17px;color:#5b5278;margin-top:4px}
.steps{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.steps span{background:#ffffffb0;padding:5px 12px;border-radius:999px;font-weight:800;font-size:13px}
.steps span.ok{background:#fff;color:#2a9d74}
.speech{display:flex;gap:14px;align-items:center}
.bubble{position:relative;background:#fff;border-radius:20px;padding:14px 18px;font-weight:700;box-shadow:var(--shadow);border:2px solid var(--pink)}
.bubble:before{content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);border:10px solid transparent;border-right-color:var(--pink)}
.roletip{border-left:6px solid var(--lav2);background:#fbf9ff}
.roletip b{color:#7a5cff}
.section h2{margin:0 0 8px;font-size:26px;display:flex;align-items:center;gap:10px}
.section h2 .num{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:var(--lav);flex:none}
.section p,.section li{font-size:16.5px;line-height:1.6}
.section code{background:#f4effc;border-radius:6px;padding:1px 6px;font-size:14px;color:#6a3fd1}
.callout{background:#f1fbff;border:2px dashed var(--sky2);border-radius:16px;padding:12px 16px;margin:12px 0;font-size:15.5px}
.callout.tip{background:#f2fff8;border-color:var(--mint2)}
.callout.warn{background:#fff6f3;border-color:var(--coral)}
table.mini{border-collapse:separate;border-spacing:0;margin:10px 0;width:100%;font-size:15px;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
table.mini th{background:var(--lav);text-align:left;padding:8px 12px}
table.mini td{padding:7px 12px;border-top:1px solid var(--line);background:#fff}
.codebox{position:relative;margin:12px 0}
pre.sqlc{margin:0;background:#2e2a45;color:#f3eefe;border-radius:16px;padding:16px 18px;padding-right:110px;font-size:14px;line-height:1.55;overflow-x:auto;white-space:pre}
pre.sqlc .k{color:#ff9fc6;font-weight:700}
pre.sqlc .s{color:#b6f2c9}
pre.sqlc .n{color:#ffd88a}
pre.sqlc .c{color:#9a92b8;font-style:italic}
pre.sqlc .f{color:#9fd3ff}
.trybtn{position:absolute;top:10px;right:10px;border:none;border-radius:12px;padding:7px 12px;font-weight:800;background:var(--mint);color:#1d5c46;font-size:13px;transition:transform .15s}
.trybtn:hover{transform:scale(1.06)}
.copybtn{position:absolute;top:44px;right:10px;border:none;border-radius:12px;padding:5px 10px;font-weight:800;background:#ffffff22;color:#e9e3ff;font-size:12px}
.result{margin-top:8px;animation:fadeUp .35s both}
.result .meta{font-size:13px;color:var(--muted);font-weight:700;margin:4px 2px}
.tblwrap{max-height:320px;overflow:auto;border-radius:14px;border:1px solid var(--line);background:#fff}
table.res{border-collapse:collapse;width:100%;font-size:13.5px}
table.res th{position:sticky;top:0;background:#f6f1ff;text-align:left;padding:7px 10px;font-family:'JetBrains Mono';font-size:12.5px}
table.res td{padding:6px 10px;border-top:1px solid #f1ecf8;white-space:nowrap}
table.res tr:nth-child(even) td{background:#fdfbff}
td.null{color:#c4bbd6;font-style:italic}
.err{background:#fff1f1;border:2px solid #ffc1c1;color:#a33;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px}
/* playground */
.play{display:grid;grid-template-columns:1fr 280px;gap:16px}
textarea.editor{width:100%;min-height:150px;border-radius:16px;border:2px solid var(--lav);background:#2e2a45;color:#f3eefe;padding:14px;font-size:14px;line-height:1.5;resize:vertical;outline:none}
textarea.editor:focus{border-color:var(--lav2);box-shadow:0 0 0 4px #e8defe}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.kbd{font-size:12px;color:var(--muted);font-weight:700}
.schema{background:#fff;border-radius:16px;border:1px solid var(--line);padding:10px 12px;max-height:330px;overflow:auto;font-size:13px}
.schema details{margin:4px 0}
.schema summary{font-weight:800;cursor:pointer;padding:4px 6px;border-radius:8px}
.schema summary:hover{background:#f6f1ff}
.schema ul{margin:2px 0 6px 0;padding-left:20px;font-family:'JetBrains Mono';font-size:12px;color:#5b5278}
/* quiz */
.q{margin:14px 0 18px}
.q .qt{font-weight:800;font-size:17px;margin-bottom:8px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;transition:all .15s}
.opt:hover{border-color:var(--lav2);transform:translateY(-2px)}
.opt.right{background:#e3fbef;border-color:var(--mint2);animation:pop .4s}
.opt.wrong{background:#fff0f0;border-color:#ffb3b3;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.why{margin-top:6px;font-size:14.5px;color:#4d6b5f;font-weight:700}
.challenge{background:linear-gradient(135deg,#fff7e0,#ffeaf2);border:2px solid #ffe1a0}
.complete-bar{text-align:center;padding:26px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(60,40,90,.35);backdrop-filter:blur(4px);z-index:50;display:grid;place-items:center;animation:fadeUp .25s}
.modal{background:#fff;border-radius:28px;padding:28px 32px;max-width:520px;width:92%;text-align:center;box-shadow:0 30px 60px -20px rgba(80,40,140,.5);animation:pop .45s}
.modal h2{font-size:30px;margin:6px 0}
.modal textarea{width:100%;height:80px;border-radius:12px;border:2px solid var(--line);padding:8px;font-family:'JetBrains Mono';font-size:12px}
.badge{width:120px;height:120px;margin:0 auto;animation:spinIn .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes spinIn{from{transform:scale(0) rotate(-200deg)}to{transform:none}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:60;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#3b3355;color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;z-index:70;animation:fadeUp .3s}
/* games */
.game-head{display:flex;gap:16px;align-items:center}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px;perspective:900px}
.mcard{height:96px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.mcard.flip,.mcard.matched{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:grid;place-items:center;font-weight:800;padding:8px;text-align:center}
.mcard .front{background:linear-gradient(135deg,#ffc8dc,#d9c9ff);font-size:30px;color:#fff;box-shadow:var(--shadow)}
.mcard .back{background:#fff;border:2px solid var(--lav);transform:rotateY(180deg);font-size:15px}
.mcard.matched .back{background:#e3fbef;border-color:var(--mint2)}
.tokens{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.token{border:2px solid var(--lav);background:#fff;border-radius:12px;padding:10px 14px;text-align:left;font-family:'JetBrains Mono';font-weight:700;font-size:14px;transition:all .2s}
.token:hover{transform:translateX(6px);border-color:var(--lav2)}
.token.used{opacity:.25;pointer-events:none}
.built{background:#2e2a45;color:#f3eefe;border-radius:16px;padding:14px;min-height:60px;font-family:'JetBrains Mono';font-size:14px;margin-top:12px}
.built div{animation:fadeUp .3s}
.jtables{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0}
.jtables table{border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:14px;box-shadow:var(--shadow)}
.jtables th{background:var(--peach);padding:6px 12px}.jtables td{padding:5px 12px;border-top:1px solid var(--line)}
.bigin{font-size:22px;width:110px;padding:8px 12px;border-radius:12px;border:2px solid var(--lav);font-weight:800;text-align:center;font-family:'Baloo 2'}
.blitz-q{font-size:24px;font-weight:800;min-height:80px;display:grid;place-items:center;text-align:center;font-family:'Baloo 2'}
.timer{height:14px;border-radius:9px;background:#f0eaf9;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mint2),var(--butter2),var(--coral));transition:width 1s linear}
.cert{border:6px double var(--lav2);border-radius:24px;padding:30px;text-align:center;background:linear-gradient(135deg,#fff,#fff4fa)}
.cert h1{font-size:42px;margin:6px 0}
.lockmsg{text-align:center;padding:40px}
.cheat pre.sqlc{padding-right:18px}
footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:13px;padding:20px}
@media (max-width:820px){
  .hero{grid-template-columns:1fr;text-align:center}.hero h1{font-size:40px}.hero p{margin:0 auto}
  .statgrid,.roles{grid-template-columns:1fr 1fr}
  .play{grid-template-columns:1fr}.opts{grid-template-columns:1fr}
  .ch-head{grid-template-columns:1fr;text-align:center}.ch-head .art{margin:0 auto}
  .nav{display:none}.pill .bar{width:60px}.memgrid{grid-template-columns:repeat(3,1fr)}
  .map{height:auto!important}.map svg.path{display:none}.node{position:relative;left:auto!important;top:auto!important;transform:none;width:auto;flex-direction:row;margin:10px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.order-strip{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.order-strip span{padding:8px 14px;border-radius:12px;font-weight:800;font-family:'JetBrains Mono';font-size:13px;background:#fff;border:2px solid var(--lav);position:relative}
.order-strip span:nth-child(1){background:#ffd8c2}.order-strip span:nth-child(2){background:#bfeedd}.order-strip span:nth-child(3){background:#c6e3ff}.order-strip span:nth-child(4){background:#ffc6da}.order-strip span:nth-child(5){background:#e1d4ff}.order-strip span:nth-child(6){background:#fff1b8}.order-strip span:nth-child(7){background:#d6f5f5}
.order-strip span:not(:last-child):after{content:"→";position:absolute;right:-11px;top:7px;color:#b9a2ff}
.kicker{font-weight:800}
.checklist li{list-style:"✅ "}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.prob{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .15s}
.prob:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.prob.solved{background:#f2fff8}
.pid{font-family:'JetBrains Mono',monospace;font-weight:800;border-radius:10px;padding:4px 8px;font-size:13px}
.pt{display:flex;flex-direction:column;gap:3px}.tags{display:flex;gap:4px;flex-wrap:wrap}.tags i{font-style:normal;font-size:11px;background:#f4effc;border-radius:6px;padding:1px 6px;color:#6a5a95;font-weight:700}
.pst{font-size:18px}
[hidden]{display:none!important}
.cmp{margin-top:10px}
.cmp-notes{background:#f6f1ff;border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:8px;line-height:1.5}
.cmp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.cmp-arrow{text-align:center;font-size:13px;letter-spacing:1px;color:#8a6fd1;font-weight:800;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.cmp-h{font-size:12px;font-weight:800;letter-spacing:1px;color:#8a6fd1;margin:2px 2px 6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cmp-h .tname{letter-spacing:0;color:var(--muted);font-weight:700;text-transform:none}
.btab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 9px;font-weight:700;font-size:12px;letter-spacing:0;color:var(--muted)}
.btab.on{background:var(--lav2);color:#fff;border-color:var(--lav2)}
.cmp .tblwrap{max-height:260px}
table.res tr.kept td{background:#e3fbef}
table.res tr.dropped td{opacity:.35}
table.res tr.added td{background:#d9f7e6;font-weight:700}
table.res tr.deleted td{background:#ffe1e1;text-decoration:line-through;opacity:.75}
table.res td.chg{background:#fff1b8!important;font-weight:800}
table.res th.usedcol{background:#ffd6e0;color:#a2355e}
.legend{font-size:12px;color:var(--muted);margin:6px 2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

{ id:'M4', diff:'Medium', title:'Close to the boss', tags:['self-join'], prompt:'Employees earning <b>at least 75%</b> of their manager\'s salary. Columns: <code>employee</code>, <code>manager</code>, <code>pct_of_manager</code> (1 decimal).', solution:"SELECT e.name AS employee, m.name AS manager, ROUND(100.0 * e.salary / m.salary, 1) AS pct_of_manager FROM employees e JOIN employees m ON m.emp_id = e.manager_id WHERE e.salary >= 0.75 * m.salary;", hint:'Self join employees e JOIN employees m ON m.emp_id = e.manager_id' },
{ id:'M5', diff:'Medium', title:'Running total 2025', tags:['window','dates'], prompt:'Completed revenue per month in <b>2025</b> with a running total. Columns: <code>month</code> (YYYY-MM), <code>revenue</code>, <code>running_total</code>. Sort by month.', solution:"WITH m AS (SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS revenue FROM orders WHERE status = 'completed' AND order_date LIKE '2025%' GROUP BY month) SELECT month, revenue, SUM(revenue) OVER (ORDER BY month) AS running_total FROM m ORDER BY month;", ordered:true, hint:'Monthly totals in a CTE, then SUM(revenue) OVER (ORDER BY month)' },
{ id:'M6', diff:'Medium', title:'Cancellation rate by region', tags:['join','CASE'], prompt:'Percentage of orders that were <b>cancelled</b>, per customer region (rounded to 1 decimal). Columns: <code>region</code>, <code>cancel_pct</code>.', solution:"SELECT c.region, ROUND(100.0 * SUM(CASE WHEN o.status = 'cancelled' THEN 1 ELSE 0 END) / COUNT(*), 1) AS cancel_pct FROM orders o JOIN customers c ON c.customer_id = o.customer_id GROUP BY c.region;", hint:'100.0 * SUM(CASE … cancelled …) / COUNT(*)' },
{ id:'M7', diff:'Medium', title:'Top earner per department', tags:['window'], prompt:'The highest-paid employee in each department. Columns: <code>dept_name</code>, <code>name</code>, <code>salary</code>.', solution:"WITH r AS (SELECT d.dept_name, e.name, e.salary, ROW_NUMBER() OVER (PARTITION BY e.dept_id ORDER BY e.salary DESC) AS rn FROM employees e JOIN departments d ON d.dept_id = e.dept_id) SELECT dept_name, name, salary FROM r WHERE rn = 1;", hint:'ROW_NUMBER() OVER (PARTITION BY dept_id ORDER BY salary DESC) = 1' },
{ id:'M8', diff:'Medium', title:'Repeat buys', tags:['duplicates'], prompt:'Customer + product pairs bought <b>more than once</b>. Columns: <code>customer_id</code>, <code>product_id</code>, <code>times</code>.', solution:"SELECT customer_id, product_id, COUNT(*) AS times FROM orders GROUP BY customer_id, product_id HAVING COUNT(*) > 1;", hint:'GROUP BY both columns HAVING COUNT(*) > 1' },
{ id:'M9', diff:'Medium', title:'Busiest weekday', tags:['dates','sort'], prompt:'Completed orders by weekday number (<code>dow</code>, 0 = Sunday). Columns: <code>dow</code>, <code>orders</code>, most orders first (ties by dow).', solution:"SELECT strftime('%w', order_date) AS dow, COUNT(*) AS orders FROM orders WHERE status = 'completed' GROUP BY dow ORDER BY orders DESC, dow;", ordered:true, hint:"strftime('%w', order_date)" },
{ id:'M10', diff:'Medium', title:'Signed up, never logged in', tags:['anti-join','events'], prompt:'<code>user_id</code> of users who have a <b>signup</b> event but <b>no login</b> events.', solution:"SELECT DISTINCT user_id FROM events WHERE event_name = 'signup' AND user_id NOT IN (SELECT user_id FROM events WHERE event_name = 'login');", hint:"signup users NOT IN (login users), or use EXCEPT" },
{ id:'M11', diff:'Medium', title:'Time to purchase', tags:['dates','events'], prompt:'For each purchaser: <code>user_id</code> and <code>days_to_purchase</code> (purchase date minus the user\'s signup_date, as a whole number).', solution:"SELECT e.user_id, CAST(julianday(e.event_date) - julianday(u.signup_date) AS INTEGER) AS days_to_purchase FROM events e JOIN users u ON u.user_id = e.user_id WHERE e.event_name = 'purchase';", hint:'julianday(purchase date) - julianday(signup_date)' },
{ id:'M12', diff:'Medium', title:'Cross-category buyers', tags:['join','HAVING'], prompt:'Names of customers who bought from <b>both</b> the Software and Services categories.', solution:"SELECT c.name FROM orders o JOIN products p ON p.product_id = o.product_id JOIN customers c ON c.customer_id = o.customer_id GROUP BY c.customer_id, c.name HAVING COUNT(DISTINCT p.category) = 2;", hint:'HAVING COUNT(DISTINCT category) = 2' },
{ id:'M13', diff:'Medium', title:'Share of revenue', tags:['window','join'], prompt:'Completed revenue by <code>category</code> and its <code>pct</code> of the total (1 decimal). Columns: <code>category</code>, <code>revenue</code>, <code>pct</code>.', solution:"SELECT p.category, SUM(o.amount) AS revenue, ROUND(100.0 * SUM(o.amount) / SUM(SUM(o.amount)) OVER (), 1) AS pct FROM orders o JOIN products p ON p.product_id = o.product_id WHERE o.status = 'completed' GROUP BY p.category;", hint:'SUM(SUM(amount)) OVER () gives the grand total' },
{ id:'M14', diff:'Medium', title:'Second-highest salary', tags:['subquery'], prompt:'The second-highest distinct salary in the company, as <code>second_salary</code>.', solution:"SELECT MAX(salary) AS second_salary FROM employees WHERE salary < (SELECT MAX(salary) FROM employees);", hint:'MAX(salary) below the overall MAX' },
{ id:'M15', diff:'Medium', title:'AOV by quarter', tags:['dates','aggregate'], prompt:'Average completed order value per quarter of <b>2025</b>. Columns: <code>quarter</code> (like <code>Q1</code>) and <code>aov</code> (2 decimals), sorted by quarter.', solution:"SELECT 'Q' || ((CAST(strftime('%m', order_date) AS INTEGER) + 2) / 3) AS quarter, ROUND(AVG(amount), 2) AS aov FROM orders WHERE status = 'completed' AND order_date LIKE '2025%' GROUP BY quarter ORDER BY quarter;", ordered:true, hint:"'Q' || ((month + 2) / 3)" },
{ id:'M16', diff:'Medium', title:'Headcount growth', tags:['window','dates'], prompt:'Hires per year and cumulative headcount (ignore missing hire dates). Columns: <code>hire_year</code>, <code>hires</code>, <code>cumulative</code>. Sort by year.', solution:"SELECT strftime('%Y', hire_date) AS hire_year, COUNT(*) AS hires, SUM(COUNT(*)) OVER (ORDER BY strftime('%Y', hire_date)) AS cumulative FROM employees WHERE hire_date IS NOT NULL GROUP BY hire_year ORDER BY hire_year;", ordered:true, hint:'SUM(COUNT(*)) OVER (ORDER BY year)' },
// ---------------- HARD ----------------
{ id:'H1', diff:'Hard', title:'Month-over-month growth', tags:['window','LAG'], prompt:'Completed revenue per month (all data) with the previous month and % change (1 decimal). Columns: <code>month</code>, <code>revenue</code>, <code>prev_revenue</code>, <code>mom_pct</code>. Sort by month.', solution:"WITH m AS (SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS revenue FROM orders WHERE status = 'completed' GROUP BY month) SELECT month, revenue, LAG(revenue) OVER (ORDER BY month) AS prev_revenue, ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month)) / LAG(revenue) OVER (ORDER BY month), 1) AS mom_pct FROM m ORDER BY month;", ordered:true, hint:'LAG(revenue) OVER (ORDER BY month)' },
{ id:'H2', diff:'Hard', title:'Top 2 per category', tags:['window'], prompt:'The top 2 products by completed revenue within each category. Columns: <code>category</code>, <code>product_name</code>, <code>revenue</code>.', solution:"WITH r AS (SELECT p.category, p.product_name, SUM(o.amount) AS revenue, ROW_NUMBER() OVER (PARTITION BY p.category ORDER BY SUM(o.amount) DESC) AS rn FROM orders o JOIN products p ON p.product_id = o.product_id WHERE o.status = 'completed' GROUP BY p.category, p.product_name) SELECT category, product_name, revenue FROM r WHERE rn <= 2;", hint:'ROW_NUMBER() OVER (PARTITION BY category ORDER BY SUM(amount) DESC) <= 2' },
{ id:'H3', diff:'Hard', title:'Full funnel', tags:['events','CTE'], prompt:'Funnel for visit → signup → trial_start → purchase. Columns: <code>step</code>, <code>users</code> (distinct), <code>pct_of_visit</code> (1 decimal). Sort by users, highest first.', solution:"WITH f AS (SELECT event_name AS step, COUNT(DISTINCT user_id) AS users FROM events WHERE event_name IN ('visit','signup','trial_start','purchase') GROUP BY event_name) SELECT step, users, ROUND(100.0 * users / (SELECT users FROM f WHERE step = 'visit'), 1) AS pct_of_visit FROM f ORDER BY users DESC;", ordered:true, hint:'COUNT(DISTINCT user_id) per event, divide by the visit count' },
{ id:'H4', diff:'Hard', title:'Month-1 retention by cohort', tags:['cohort','events'], prompt:'For each signup month (<code>cohort</code>, YYYY-MM from users.signup_date): <code>cohort_size</code>, <code>m1_users</code> (users with a login in the <b>next calendar month</b>), and <code>m1_pct</code> (1 decimal). Sort by cohort.', solution:"WITH c AS (SELECT user_id, strftime('%Y-%m', signup_date) AS cohort, strftime('%Y-%m', date(signup_date, 'start of month', '+1 month')) AS next_m FROM users), r AS (SELECT DISTINCT c.user_id, c.cohort FROM c JOIN events e ON e.user_id = c.user_id AND e.event_name = 'login' AND strftime('%Y-%m', e.event_date) = c.next_m) SELECT c.cohort, COUNT(*) AS cohort_size, COUNT(r.user_id) AS m1_users, ROUND(100.0 * COUNT(r.user_id) / COUNT(*), 1) AS m1_pct FROM c LEFT JOIN r ON r.user_id = c.user_id GROUP BY c.cohort ORDER BY c.cohort;", ordered:true, hint:"next month = date(signup_date,'start of month','+1 month'); LEFT JOIN the retained users" },
{ id:'H5', diff:'Hard', title:'Longest login streak', tags:['gaps-islands'], prompt:'For users whose longest run of consecutive login days is <b>3 or more</b>: <code>user_id</code>, <code>streak_days</code>. Sort by user_id.', solution:"WITH d AS (SELECT DISTINCT user_id, event_date FROM events WHERE event_name = 'login'), g AS (SELECT user_id, julianday(event_date) - ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_date) AS grp FROM d), s AS (SELECT user_id, COUNT(*) AS len FROM g GROUP BY user_id, grp) SELECT user_id, MAX(len) AS streak_days FROM s GROUP BY user_id HAVING MAX(len) >= 3 ORDER BY user_id;", ordered:true, hint:'date − ROW_NUMBER() groups each streak; then MAX per user' },
{ id:'H6', diff:'Hard', title:'Above-average customers', tags:['CTE','subquery'], prompt:'Customers whose completed spend is above the <b>average completed spend per customer</b>. Columns: <code>name</code>, <code>spend</code>.', solution:"WITH s AS (SELECT customer_id, SUM(amount) AS spend FROM orders WHERE status = 'completed' GROUP BY customer_id) SELECT c.name, s.spend FROM s JOIN customers c ON c.customer_id = s.customer_id WHERE s.spend > (SELECT AVG(spend) FROM s);", hint:'Spend per customer in a CTE, compare to AVG(spend) from the same CTE' },
{ id:'H7', diff:'Hard', title:'Days to second order', tags:['window','LEAD'], prompt:'For customers with 2+ orders: <code>name</code> and <code>days_between</code> their first and second order (whole number).', solution:"WITH r AS (SELECT customer_id, order_date, ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS rn, LEAD(order_date) OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS next_date FROM orders) SELECT c.name, CAST(julianday(r.next_date) - julianday(r.order_date) AS INTEGER) AS days_between FROM r JOIN customers c ON c.customer_id = r.customer_id WHERE r.rn = 1 AND r.next_date IS NOT NULL;", hint:'LEAD(order_date) on the first order (rn = 1)' },
{ id:'H8', diff:'Hard', title:'Median order', tags:['window'], prompt:'The <b>median</b> completed order amount, as <code>median_amount</code>.', solution:"WITH r AS (SELECT amount, ROW_NUMBER() OVER (ORDER BY amount) AS rn, COUNT(*) OVER () AS n FROM orders WHERE status = 'completed') SELECT AVG(amount) AS median_amount FROM r WHERE rn IN ((n + 1) / 2, (n + 2) / 2);", hint:'ROW_NUMBER and COUNT(*) OVER (), keep the middle one or two rows' },
{ id:'H9', diff:'Hard', title:'3-month moving average', tags:['window'], prompt:'Completed revenue per month (all data) and the average of that month and the 2 before it (1 decimal). Columns: <code>month</code>, <code>revenue</code>, <code>avg_3m</code>. Sort by month.', solution:"WITH m AS (SELECT strftime('%Y-%m', order_date) AS month, SUM(amount) AS revenue FROM orders WHERE status = 'completed' GROUP BY month) SELECT month, revenue, ROUND(AVG(revenue) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW), 1) AS avg_3m FROM m ORDER BY month;", ordered:true, hint:'AVG(...) OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)' },
{ id:'H10', diff:'Hard', title:'Yearly rep ranking', tags:['window','dates'], prompt:'Rank reps by completed revenue <b>within each year</b>. Columns: <code>year</code>, <code>name</code>, <code>revenue</code>, <code>rnk</code> (RANK). Sort by year, then rnk.', solution:"SELECT strftime('%Y', o.order_date) AS year, e.name, SUM(o.amount) AS revenue, RANK() OVER (PARTITION BY strftime('%Y', o.order_date) ORDER BY SUM(o.amount) DESC) AS rnk FROM orders o JOIN employees e ON e.emp_id = o.emp_id WHERE o.status = 'completed' GROUP BY year, e.name ORDER BY year, rnk;", ordered:true, hint:'RANK() OVER (PARTITION BY year ORDER BY SUM(amount) DESC)' },
{ id:'H11', diff:'Hard', title:'Org chart levels', tags:['recursive'], prompt:'Every employee with their <code>level</code> in the org chart (the CEO with no manager = 1). Columns: <code>name</code>, <code>level</code>.', solution:"WITH RECURSIVE t AS (SELECT emp_id, name, 1 AS level FROM employees WHERE manager_id IS NULL UNION ALL SELECT e.emp_id, e.name, t.level + 1 FROM employees e JOIN t ON e.manager_id = t.emp_id) SELECT name, level FROM t;", hint:'WITH RECURSIVE: start at manager_id IS NULL, join children to parents' },
{ id:'H12', diff:'Hard', title:'Pareto 80%', tags:['window'], prompt:'Customers ranked by completed spend, with cumulative % of total (1 decimal). Return only rows up to and including the one that crosses <b>80%</b>. Columns: <code>name</code>, <code>spend</code>, <code>cum_pct</code>, highest spend first.', solution:"WITH s AS (SELECT c.name, SUM(o.amount) AS spend FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE o.status = 'completed' GROUP BY c.name), r AS (SELECT name, spend, 100.0 * SUM(spend) OVER (ORDER BY spend DESC, name ROWS UNBOUNDED PRECEDING) / SUM(spend) OVER () AS cum, 100.0 * (SUM(spend) OVER (ORDER BY spend DESC, name ROWS UNBOUNDED PRECEDING) - spend) / SUM(spend) OVER () AS prev FROM s) SELECT name, spend, ROUND(cum, 1) AS cum_pct FROM r WHERE prev < 80 ORDER BY spend DESC, name;", ordered:true, hint:'Running SUM over spend DESC; keep rows whose previous cumulative % was under 80' },
// ---------------- CASE STUDY ----------------
{ id:'C1', diff:'Case study', title:'QBR 1: Headline numbers', tags:['case'], prompt:'<b>Lumi Labs quarterly business review.</b> The CEO wants completed <code>orders</code> and <code>revenue</code> per <code>year</code>. Sort by year.', solution:"SELECT strftime('%Y', order_date) AS year, COUNT(*) AS orders, SUM(amount) AS revenue FROM orders WHERE status = 'completed' GROUP BY year ORDER BY year;", ordered:true, hint:"GROUP BY strftime('%Y', order_date)" },
{ id:'C2', diff:'Case study', title:'QBR 2: Winning category', tags:['case'], prompt:'Which product <code>category</code> earned the most completed <code>revenue</code> in <b>2025</b>? Return just that one row.', solution:"SELECT p.category, SUM(o.amount) AS revenue FROM orders o JOIN products p ON p.product_id = o.product_id WHERE o.status = 'completed' AND o.order_date LIKE '2025%' GROUP BY p.category ORDER BY revenue DESC LIMIT 1;", ordered:true, hint:'GROUP BY category ORDER BY revenue DESC LIMIT 1' },
{ id:'C3', diff:'Case study', title:'QBR 3: Regional momentum', tags:['case'], prompt:'Completed revenue per customer <code>region</code> for <code>h1</code> (Jan to Jun 2025) and <code>h2</code> (Jul to Dec 2025), plus <code>growth_pct</code> = (h2 − h1) / h1 × 100 (1 decimal). Regions with no H1 revenue: show NULL growth.', solution:"WITH x AS (SELECT c.region, SUM(CASE WHEN o.order_date BETWEEN '2025-01-01' AND '2025-06-30' THEN o.amount ELSE 0 END) AS h1, SUM(CASE WHEN o.order_date BETWEEN '2025-07-01' AND '2025-12-31' THEN o.amount ELSE 0 END) AS h2 FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE o.status = 'completed' GROUP BY c.region) SELECT region, h1, h2, ROUND(100.0 * (h2 - h1) / NULLIF(h1, 0), 1) AS growth_pct FROM x;", hint:'Conditional SUMs for each half, then NULLIF(h1, 0) to avoid divide-by-zero' },
{ id:'C4', diff:'Case study', title:'QBR 4: Rep leaderboard', tags:['case'], prompt:'Each rep\'s completed <code>revenue</code> and <code>pct_of_total</code> (1 decimal), highest first. Columns: <code>name</code>, <code>revenue</code>, <code>pct_of_total</code>.', solution:"SELECT e.name, SUM(o.amount) AS revenue, ROUND(100.0 * SUM(o.amount) / SUM(SUM(o.amount)) OVER (), 1) AS pct_of_total FROM orders o JOIN employees e ON e.emp_id = o.emp_id WHERE o.status = 'completed' GROUP BY e.name ORDER BY revenue DESC;", ordered:true, hint:'SUM(SUM(amount)) OVER () for the total' },
{ id:'C5', diff:'Case study', title:'QBR 5: Marketing ROI', tags:['case','events'], prompt:'Which acquisition <code>channel</code> has the best signup → purchase conversion? Return <code>channel</code> and <code>conversion_pct</code> (1 decimal) for the single best channel. Then ask yourself: is it trustworthy? Check how many signups that channel had.', solution:"WITH x AS (SELECT u.channel, COUNT(DISTINCT CASE WHEN e.event_name = 'purchase' THEN e.user_id END) * 100.0 / COUNT(DISTINCT CASE WHEN e.event_name = 'signup' THEN e.user_id END) AS conv FROM users u JOIN events e ON e.user_id = u.user_id GROUP BY u.channel) SELECT channel, ROUND(conv, 1) AS conversion_pct FROM x ORDER BY conv DESC LIMIT 1;", ordered:true, hint:'Conversion per channel in a CTE, then ORDER BY … DESC LIMIT 1' }
];

const STORY = {
1:{ cast:'👩‍💼 Priya, Head of Clinic Operations', ask:'"Welcome, Arjun! Everything about our clinic lives in the database: every patient, doctor and appointment. Before you analyse anything, get to know what\'s in there."',
  analogy:'A <b>table</b> is like the clinic\'s patient register. Each <b>row</b> is one patient\'s chart, and each <b>column</b> is one box on the intake form (name, birth date, insurance). The <b>primary key</b> works like a Medical Record Number (MRN): unique to every patient. A <b>foreign key</b> is that MRN written on a lab slip, so the slip can be matched back to the right chart.',
  why:'Hospitals and clinics have millions of records. Nobody scrolls through them. You ask the database questions in SQL, and it hands back exactly the rows you need in seconds.',
  when:['You join any team and need to see what data exists','Someone says "it\'s in the warehouse, can you pull it?"','Before every analysis: look at the raw rows first'],
  how:'<code>SELECT * FROM patients;</code> means "show me every column (*) from the patients table".' },
2:{ cast:'🩺 Dr. Amara Okoye, General Practice', ask:'"I need a simple list of our doctors and their specialties for the new website. Just the names and specialties, not salaries or hire dates!"',
  analogy:'A patient chart has 50 fields, but a referral letter only needs name, birth date and the reason. <b>SELECT</b> lets you photocopy only the boxes you need. <b>AS</b> renames a column header. <b>DISTINCT</b> is like listing each ward once, even if 200 patients are in them.',
  why:'Picking only the columns you need makes reports readable, protects private data (privacy rules say only use what\'s necessary) and makes queries faster.',
  when:['A manager wants "just the names and phone numbers"','You need a clean column header for a report','You want the list of unique values (all specialties, all cities)','You need a quick calculation (fee + tax)'],
  how:'<code>SELECT name, specialty FROM doctors;</code>, <code>SELECT visit_fee * 1.1 AS fee_with_tax</code>, <code>SELECT DISTINCT city FROM patients;</code>' },
3:{ cast:'👩‍⚕️ Nurse Manager Rosa', ask:'"Our diabetes educator wants to call every patient whose HbA1c is 6.5 or higher. Can you give me just those patients?"',
  analogy:'<b>WHERE</b> is triage. Out of everyone in the waiting room, it lets through only the people who meet the criteria. AND = both conditions must be true ("over 65 <i>and</i> on Medicare"). OR = either one is enough. NULL = a blank box on the form: unknown, not zero.',
  why:'Almost every real question has a filter: this month, this doctor, abnormal results only, no-shows only. Filtering early also keeps reports fast.',
  when:['"Only patients from Riverside"','"Appointments that were no-shows"','"Lab results above the healthy range"','"Patients with no insurance on file" (IS NULL)'],
  how:'<code>SELECT * FROM lab_results WHERE test = \'HbA1c\' AND value >= 6.5;</code>' },
4:{ cast:'🏥 Front Desk Lead Marcus', ask:'"Which 5 patients are the oldest? We\'re planning priority flu-shot calls, and I need them in order."',
  analogy:'<b>ORDER BY</b> is sorting the waiting list: by arrival time, by urgency, by name. <b>DESC</b> puts the biggest or latest first. <b>LIMIT</b> is "just show me the first 5 on the list".',
  why:'People act on the top of a list: the five most expensive prescriptions, the ten busiest days. Sorting turns raw rows into priorities.',
  when:['"Top 10 / bottom 10" questions','"Most recent" or "oldest" records','Any report someone will read top-down'],
  how:'<code>SELECT first_name, birth_date FROM patients ORDER BY birth_date LIMIT 5;</code>' },
5:{ cast:'📋 Clinic Director Dr. Chen', ask:'"For the board meeting I need totals: how many appointments each doctor had, and how much revenue each specialty brought in."',
  analogy:'<b>GROUP BY</b> is the daily ward census: instead of listing 200 patients, you write one line per ward with a count. <b>COUNT, SUM, AVG, MIN, MAX</b> are the numbers on that census line. <b>HAVING</b> filters whole wards, e.g. "only wards with more than 20 patients".',
  why:'Leaders make decisions from summaries, not from thousands of rows. GROUP BY is how almost every dashboard number gets made.',
  when:['"How many…per…" (visits per doctor, patients per city)','"Total / average…by…" (revenue by specialty)','"Which groups have more than…" (HAVING)'],
  how:'<code>SELECT doctor_id, COUNT(*) FROM appointments GROUP BY doctor_id;</code>' },
6:{ cast:'🔬 Lab Coordinator Kofi', ask:'"The lab results table only has patient IDs. The doctors want names next to the results. Can you match them up?"',
  analogy:'A <b>JOIN</b> matches the MRN on a lab slip to the MRN on the patient chart and staples them together. <b>INNER JOIN</b> keeps only slips that found their chart. <b>LEFT JOIN</b> keeps every chart, even patients with no lab slips yet (their lab columns are blank).',
  why:'Clinic data is split across tables so nothing is typed twice. Patients, doctors, appointments and labs each live in their own table. Real questions almost always need two or more of them together.',
  when:['You need names, but the table only has IDs','"Which patients have never booked?" (LEFT JOIN + IS NULL)','Revenue by specialty (appointments + doctors)'],
  how:'<code>SELECT p.first_name, l.test, l.value FROM lab_results l JOIN patients p ON p.patient_id = l.patient_id;</code>' },
7:{ cast:'🩸 Dr. Gita Rao, Endocrinology', ask:'"Can you label every HbA1c result as Normal, Prediabetes or Diabetes? Under 5.7 is normal, 5.7 to 6.4 is prediabetes, and 6.5 or above is diabetes."',
  analogy:'<b>CASE</b> works like a clinical decision rule: IF value ≥ 6.5 THEN "Diabetes", ELSE IF ≥ 5.7 THEN "Prediabetes", ELSE "Normal". <b>COALESCE</b> fills a blank on the form with a default, for example a missing insurance becomes "Self-pay".',
  why:'Raw numbers mean little to busy people. Categories (risk bands, age groups, on-time / late) make data instantly understandable.',
  when:['Turning numbers into bands (age groups, risk levels)','Replacing blanks (NULL → "Unknown")','Counting by condition (no-shows vs completed in one row)','Cleaning text (UPPER, initials)'],

8:{ cast:'📊 Quality Lead Hannah', ask:'"Which patients visit more often than the average patient? I want to check whether our care plans are working."',
  analogy:'A <b>subquery</b> is a question inside a question: first work out the average number of visits, then find who\'s above it. A <b>CTE</b> (<code>WITH</code>) is a clinical pathway written as numbered steps. Step 1: count visits per patient. Step 2: compare to the average. Each step is easy to read and check.',
  why:'Real questions have several steps. Writing them as CTEs keeps your logic readable, easy to debug and easy for a colleague to review.',
  when:['"Above / below average" questions','Multi-step logic (first summarise, then filter or join)','You catch yourself copying the same subquery twice'],
  how:'<code>WITH visits AS (SELECT patient_id, COUNT(*) AS n FROM appointments GROUP BY patient_id) SELECT * FROM visits WHERE n > (SELECT AVG(n) FROM visits);</code>' },
9:{ cast:'🫀 Dr. Chen Wei, Cardiology', ask:'"For each patient, I want to see their visits in order, numbered 1, 2, 3…, plus how many days since the previous visit."',
  analogy:'A <b>window function</b> looks at a patient\'s whole timeline <i>without</i> merging the rows. Every visit stays on its own line, but you can number them (ROW_NUMBER), rank them (RANK), add a running total, or peek at the previous visit (LAG). <b>PARTITION BY patient</b> = "do this separately for each patient\'s chart".',
  why:'Timelines, rankings and "compared to last time" are everywhere in healthcare: follow-up gaps, readmissions, the busiest doctor each month.',
  when:['Numbering events per person (1st visit, 2nd visit…)','Top-N per group (top doctor per specialty)','Running totals and month-over-month change','Comparing a row to the previous one (LAG)'],
  how:'<code>ROW_NUMBER() OVER (PARTITION BY patient_id ORDER BY appt_date)</code>' },
10:{ cast:'💼 CFO Mr. Adams', ask:'"Every month I need one clinic scorecard: visits, revenue, no-show rate and our busiest specialty. Can SQL produce it automatically?"',
  analogy:'A KPI report is like the hospital\'s monthly quality scorecard: a few trusted numbers (visits, revenue, no-show rate) calculated the same way every time.',
  why:'This is the job: turning raw records into numbers leaders use. Analyst interviews often ask you to write exactly these queries.',
  when:['Monthly or weekly management reporting','Rates and percentages (no-show %, share of revenue)','Year-over-year or month-over-month comparisons'],
  how:'Combine everything: GROUP BY month, conditional counts (CASE), ROUND(100.0 * …), window functions for share-of-total.' },
11:{ cast:'🗂️ Records Officer Ines', ask:'"A patient moved city, three appointments need their status fixed, and we must remove two test records someone created. Can you update the database safely?"',
  analogy:'<b>INSERT</b> = registering a new patient. <b>UPDATE</b> = correcting a field on an existing chart. <b>DELETE</b> = removing a record. A <b>transaction</b> is the medication double-check: BEGIN, make your changes, check them, then COMMIT to save or ROLLBACK to undo.',
  why:'Analysts often maintain lookup and mapping tables and fix data issues. One careless UPDATE without WHERE can change every patient\'s record, so safe habits matter.',
  when:['Correcting a data error','Loading a new reference list (e.g. new drug codes)','Archiving or removing test records','Any change you might need to undo: use a transaction'],
  how:'<code>UPDATE patients SET city = \'Springfield\' WHERE patient_id = 7;</code> Always run the matching SELECT first!' },
12:{ cast:'🏗️ Data Architect Felix', ask:'"We\'re starting a vaccination programme. We need a new table that won\'t accept bad data, and a saved \'today\'s schedule\' view for the front desk."',
  analogy:'<b>CREATE TABLE</b> designs a new paper form. <b>Constraints</b> are the form\'s rules: required fields (NOT NULL), allowed values (CHECK dose between 1 and 3), and no duplicates (UNIQUE). A <b>view</b> is a saved report the front desk opens every morning: always up to date, never re-typed.',
  why:'Good structure prevents bad data at the door, which is far cheaper than cleaning it later. Views give everyone one agreed definition, e.g. of a "completed visit".',
  when:['A new process needs a new table','You want the database to reject invalid values','Many reports reuse the same query (make it a view)'],
  how:'<code>CREATE TABLE vaccinations (vacc_id INTEGER PRIMARY KEY, patient_id INTEGER NOT NULL, dose INTEGER CHECK (dose BETWEEN 1 AND 3));</code>' },
13:{ cast:'🧹 Data Quality Analyst Zara', ask:'"Why does my count of insured patients look wrong? And can you make one contact list of all patients and doctors for the holiday cards?"',
  analogy:'<b>UNION</b> stacks two lists into one, like merging the patient and staff phone lists. <b>INTERSECT</b> = people on both lists. <b>EXCEPT</b> = on the first list but not the second. <b>NULL</b>s are blanks on forms: they silently change counts and averages unless you handle them on purpose.',
  why:'Real data is messy. Blanks, duplicates and lists from different systems are daily problems. Spotting them is what makes an analyst trusted.',
  when:['Combining lists from two tables or systems','"Who is in A but not in B?"','Counts look odd (check NULLs and duplicates first)'],
  how:'<code>SELECT first_name FROM patients UNION SELECT name FROM doctors;</code>, <code>COALESCE(insurance, \'Self-pay\')</code>' },
14:{ cast:'📅 Scheduling Manager Victor', ask:'"How old is each patient? How many days pass between a patient\'s visits? And which weekday has the most no-shows?"',
  analogy:'Dates in SQL are like the clinic calendar. You can pull out the month, count days between two appointments, or find the month\'s start. Text functions are like tidying names on a form: capitals, initials, joining first and last name.',
  why:'Healthcare runs on time: ages, follow-up windows, days to appointment, seasonal flu peaks. Date skills turn up in almost every analyst task.',
  when:['Ages from birth dates','Days or weeks between events','Grouping by month, week or weekday','Cleaning and combining names'],
  how:'<code>strftime(\'%Y-%m\', appt_date)</code>, <code>julianday(b) - julianday(a)</code>, <code>first_name || \' \' || last_name</code>' },
15:{ cast:'📈 Population Health Lead Dr. Lind', ask:'"How many patients come back within 30 days of a visit? What\'s our no-show rate by doctor? Are January\'s new patients still coming back months later?"',
  analogy:'These are the clinic\'s classic analytics patterns. <b>Readmission / return within 30 days</b> uses LAG on each patient\'s timeline. <b>Funnels</b> track booked → attended. <b>Cohorts</b> follow everyone who started in the same month, like a clinical study.',
  why:'These patterns answer the questions healthcare and product teams ask most. Once you know the template, you can reuse it for any dataset.',
  when:['Return or readmission rates','Booked-to-attended (or visit-to-purchase) conversion','"Do new patients stick with us?" (retention)'],
  how:'<code>LAG(appt_date) OVER (PARTITION BY patient_id ORDER BY appt_date)</code>, then compare dates.' },
16:{ cast:'🧑‍💻 Interviewer from a Health-Tech Company', ask:'"Our appointments table has 50 million rows and the dashboard is slow. Also, walk me through how you would find each doctor\'s busiest month."',
  analogy:'An <b>index</b> is the front desk\'s alphabetical card file. Instead of checking every chart in the building (a full scan), you jump straight to the right drawer. Interviews test how you <i>think</i>: clarify the question, check the grain, build in steps, then test edge cases.',
  why:'Fast queries keep dashboards usable. A clear problem-solving method gets you hired.',
  when:['A query on a big table is slow','You filter or join on the same column all the time','Any SQL interview or take-home task'],
  how:'<code>CREATE INDEX idx_appt_patient ON appointments(patient_id);</code>, then <code>EXPLAIN QUERY PLAN …</code>' }
};

15:[
 {t:'Return within 30 days', s:'Dr. Lind: completed visits followed by another visit within 30 days.', p:'Show <code>patient_id</code>, <code>appt_date</code>, <code>next_date</code> where the next visit (LEAD, ties by appt_id) is within 30 days.', sol:"WITH n AS (SELECT patient_id, appt_date, status, LEAD(appt_date) OVER (PARTITION BY patient_id ORDER BY appt_date, appt_id) AS next_date FROM appointments) SELECT patient_id, appt_date, next_date FROM n WHERE status = 'completed' AND next_date IS NOT NULL AND julianday(next_date) - julianday(appt_date) <= 30;", h:'LEAD(appt_date) per patient, then keep gaps ≤ 30 days', lv:3, k:'retention'},
 {t:'30-day return rate', s:'What % of completed visits are followed by another within 30 days?', p:'Show <code>return_pct</code> (1 decimal).', sol:"WITH n AS (SELECT status, julianday(LEAD(appt_date) OVER (PARTITION BY patient_id ORDER BY appt_date, appt_id)) - julianday(appt_date) AS gap FROM appointments) SELECT ROUND(100.0 * SUM(CASE WHEN gap <= 30 THEN 1 ELSE 0 END) / COUNT(*), 1) AS return_pct FROM n WHERE status = 'completed';", h:'gap via LEAD, then rate over completed visits', lv:3, k:'retention'},
 {t:'Booked → attended funnel', s:'Of all booked visits, how many happened?', p:'Show <code>booked</code>, <code>attended</code>, <code>attend_pct</code> (1 decimal).', sol:"SELECT COUNT(*) AS booked, SUM(CASE WHEN status = 'completed' THEN 1 ELSE 0 END) AS attended, ROUND(100.0 * SUM(CASE WHEN status = 'completed' THEN 1 ELSE 0 END) / COUNT(*), 1) AS attend_pct FROM appointments;", h:'COUNT(*), SUM(CASE…), rate', lv:2, k:'funnel'},
 {t:'Funnel by specialty', s:'Attendance rate per specialty.', p:'Show <code>specialty</code>, <code>attend_pct</code> (1 decimal), lowest first (ties by specialty).', sol:"SELECT d.specialty, ROUND(100.0 * SUM(CASE WHEN a.status = 'completed' THEN 1 ELSE 0 END) / COUNT(*), 1) AS attend_pct FROM appointments a JOIN doctors d ON d.doctor_id = a.doctor_id GROUP BY d.specialty ORDER BY attend_pct, d.specialty;", h:'Same rate, grouped by specialty', lv:2, k:'funnel', o:1},
 {t:'First-visit cohorts', s:'Group patients by the month of their first visit.', p:'Show <code>cohort</code> (YYYY-MM of first visit) and <code>patients</code>, sorted.', sol:"WITH f AS (SELECT patient_id, MIN(appt_date) AS first_visit FROM appointments GROUP BY patient_id) SELECT strftime('%Y-%m', first_visit) AS cohort, COUNT(*) AS patients FROM f GROUP BY cohort ORDER BY cohort;", h:'MIN(appt_date) per patient, then group by its month', lv:2, k:'retention', o:1},
 {t:'Still returning?', s:'Patients whose first visit was in Q1 and who came back after June.', p:'Show <code>patient_id</code> of patients with first visit before 2025-04-01 AND any visit on/after 2025-07-01.', sol:"WITH f AS (SELECT patient_id, MIN(appt_date) AS first_visit, MAX(appt_date) AS last_visit FROM appointments GROUP BY patient_id) SELECT patient_id FROM f WHERE first_visit < '2025-04-01' AND last_visit >= '2025-07-01';", h:'MIN and MAX date per patient', lv:2, k:'retention'},
 {t:'Login streaks (app data)', s:'Same pattern in product analytics: 3+ day login streaks.', p:'Show <code>user_id</code>, <code>streak_start</code>, <code>days</code> for login streaks of 3+ days.', sol:"WITH d AS (SELECT DISTINCT user_id, event_date FROM events WHERE event_name = 'login'), g AS (SELECT user_id, event_date, julianday(event_date) - ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY event_date) AS grp FROM d) SELECT user_id, MIN(event_date) AS streak_start, COUNT(*) AS days FROM g GROUP BY user_id, grp HAVING COUNT(*) >= 3;", h:'date − ROW_NUMBER() groups consecutive days', lv:3, k:'gaps'},
 {t:'Signup → purchase (app)', s:'The same funnel idea for an app.', p:'Show <code>signups</code>, <code>purchasers</code> (distinct users).', sol:"SELECT COUNT(DISTINCT CASE WHEN event_name = 'signup' THEN user_id END) AS signups, COUNT(DISTINCT CASE WHEN event_name = 'purchase' THEN user_id END) AS purchasers FROM events;", h:'COUNT(DISTINCT CASE WHEN … THEN user_id END)', lv:2, k:'funnel'},
 {t:'Median fee', s:'Median completed-visit fee (resistant to outliers).', p:'Show <code>median_fee</code>.', sol:"WITH r AS (SELECT fee, ROW_NUMBER() OVER (ORDER BY fee) AS rn, COUNT(*) OVER () AS n FROM appointments WHERE status = 'completed') SELECT AVG(fee) AS median_fee FROM r WHERE rn IN ((n + 1) / 2, (n + 2) / 2);", h:'ROW_NUMBER + COUNT(*) OVER (), keep the middle row(s)', lv:3, k:'gaps'},
 {t:'Patients with worsening HbA1c', s:'Whose latest HbA1c is higher than their previous one?', p:'Show <code>patient_id</code>, <code>prev_value</code>, <code>value</code> where value > previous (LAG).', sol:"WITH h AS (SELECT patient_id, value, LAG(value) OVER (PARTITION BY patient_id ORDER BY result_date, result_id) AS prev_value FROM lab_results WHERE test = 'HbA1c') SELECT patient_id, prev_value, value FROM h WHERE prev_value IS NOT NULL AND value > prev_value;", h:'LAG(value) per patient, compare', lv:3, k:'retention'},
 {t:'No-show repeaters', s:'Patients with 2+ no-shows: candidates for reminder calls.', p:'Show <code>patient_id</code>, <code>no_shows</code> where no_shows ≥ 2.', sol:"SELECT patient_id, COUNT(*) AS no_shows FROM appointments WHERE status = 'no-show' GROUP BY patient_id HAVING COUNT(*) >= 2;", h:"WHERE status = 'no-show' GROUP BY patient_id HAVING COUNT(*) >= 2", lv:1, k:'funnel'}
],

const KW = new Set('SELECT FROM WHERE AND OR NOT IN IS NULL AS ON JOIN LEFT RIGHT FULL OUTER INNER CROSS GROUP BY ORDER HAVING LIMIT OFFSET DISTINCT CASE WHEN THEN ELSE END WITH ASC DESC BETWEEN LIKE OVER PARTITION EXISTS UNION ALL INSERT INTO VALUES UPDATE SET DELETE CREATE TABLE ROWS PRECEDING CURRENT ROW'.split(' '));

  const re = /(--[^\n]*)|('(?:[^']|'')*')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]+\b)/g; let out = '', last = 0, m;
  while((m = re.exec(sql))){
    out += esc(sql.slice(last, m.index)); last = re.lastIndex;
    if(m[1]) out += `<span class="c">${esc(m[1])}</span>`;
    else if(m[2]) out += `<span class="s">${esc(m[2])}</span>`;
    else if(m[3]) out += `<span class="n">${m[3]}</span>`;

}

    ["Change data", "INSERT INTO t (a, b) VALUES (1, 'x');\nUPDATE t SET b = 'y' WHERE a = 1;   -- preview with SELECT first!\nDELETE FROM t WHERE a = 1;\nBEGIN; ... ROLLBACK;  -- or COMMIT"],
    ["Build tables & views", "CREATE TABLE t (id INTEGER PRIMARY KEY, name TEXT NOT NULL UNIQUE, score INTEGER CHECK (score >= 0));\nCREATE VIEW v AS SELECT ...;\nCREATE INDEX idx_t_name ON t(name);"],
    ["Combine results", "SELECT ... UNION ALL SELECT ...   -- stack (UNION removes dups)\nSELECT ... INTERSECT SELECT ...   -- in both\nSELECT ... EXCEPT SELECT ...      -- in first, not second"],
    ["Dates (SQLite)", "strftime('%Y-%m', d)   date(d, '+7 days')   date(d, 'start of month')\njulianday(b) - julianday(a)   -- days between"],
    ["Window functions", "ROW_NUMBER() OVER (PARTITION BY grp ORDER BY val DESC)\nRANK() / DENSE_RANK() OVER (ORDER BY val DESC)\nSUM(val) OVER (ORDER BY dt)            -- running total\nLAG(val) OVER (ORDER BY dt)            -- previous row"]
  ];
  return `<section class="view"><div class="ch-head" style="background:linear-gradient(135deg,#e1d4ff,#fff)">${art('nest','#e1d4ff')}<div><div class="kicker">Reference</div><h1>Cheat sheet</h1><div class="sub">Everything from the course on one page. Try any of it in the playground at the bottom.</div></div></div>
  <div class="card cheat"><h2 style="margin:0 0 8px">⏱️ The order SQL runs in</h2><div class="order-strip"><span>FROM</span><span>WHERE</span><span>GROUP BY</span><span>HAVING</span><span>SELECT</span><span>ORDER BY</span><span>LIMIT</span></div></div>
  ${blocks.map(([h, s]) => `<div class="card cheat reveal"><h2 style="margin:0 0 8px">${h}</h2><pre class="sqlc">${hl(s)}</pre></div>`).join('')}
  ${playground('SELECT * FROM orders LIMIT 10;')}</section>`;
}

// ---------- Practice Gym ----------
const DIFFS = ['Easy','Medium','Hard','Case study'];
const DCOLOR = {'Easy':'#d9f7e6','Medium':'#fff1c9','Hard':'#ffd6e0','Case study':'#e6e0ff'};
let gymFilter = 'All';
function viewGym(){
  const solved = Object.keys(S.gym).length;
  return `<section class="view"><div class="ch-head" style="background:linear-gradient(135deg,#d9f7e6,#efe1ff)">${art('trophy','#d9f7e6')}<div><div class="kicker">Practice Gym</div><h1>${PROBLEMS.length} interview-style problems</h1><div class="sub">Easy → Medium → Hard → a 5-part business case study. Each one is graded automatically against Lumi Labs' data.</div>
    <div class="steps">${DIFFS.map(d => { const ps = PROBLEMS.filter(p => p.diff === d); return `<span class="${ps.every(p => S.gym[p.id]) ? 'ok' : ''}">${d}: ${ps.filter(p => S.gym[p.id]).length}/${ps.length}</span>`; }).join('')}<span>💎 ${DIFF_GEMS.Easy} / ${DIFF_GEMS.Medium} / ${DIFF_GEMS.Hard} gems each</span></div></div></div>
  <div class="card reveal" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><b>Progress: ${solved}/${PROBLEMS.length}</b><div style="flex:1;min-width:160px;height:12px;background:#f0eaf9;border-radius:9px;overflow:hidden"><i style="display:block;height:100%;width:${solved/PROBLEMS.length*100}%;background:linear-gradient(90deg,var(--mint2),var(--lav2))"></i></div><a class="btn small" href="#mock" style="text-decoration:none">⏱️ Mock interview</a></div>
  <div class="row" id="gymFilters">${['All', ...DIFFS, 'Unsolved'].map(f => `<button class="btn ${f === gymFilter ? '' : 'ghost'} small" data-f="${f}">${f}</button>`).join('')}</div>
  ${DIFFS.map(d => { const ps = PROBLEMS.filter(p => p.diff === d && (gymFilter === 'All' || gymFilter === d || (gymFilter === 'Unsolved' && !S.gym[p.id]))); if(!ps.length) return '';
    return `<div class="card reveal"><h2 style="margin:0 0 10px">${d === 'Easy' ? '🌱' : d === 'Medium' ? '🌿' : d === 'Hard' ? '🌳' : '💼'} ${d}${d === 'Case study' ? ': Lumi Labs quarterly business review' : ''}</h2><div class="plist">${ps.map(p => `<a class="prob ${S.gym[p.id] ? 'solved' : ''}" href="#p-${p.id}"><span class="pid" style="background:${DCOLOR[p.diff]}">${p.id}</span><span class="pt"><b>${esc(p.title)}</b><span class="tags">${p.tags.map(t => `<i>${t}</i>`).join('')}</span></span><span class="pst">${S.gym[p.id] ? '✅' : '→'}</span></a>`).join('')}</div></div>`; }).join('')}
  </section>`;
}
function wireGym(){ $$('#gymFilters button').forEach(b => b.onclick = () => { gymFilter = b.dataset.f; route(); }); }
function viewProblem(id){
  const i = PROBLEMS.findIndex(p => p.id === id); if(i < 0) return viewGym(); const p = PROBLEMS[i], prev = PROBLEMS[i-1], next = PROBLEMS[i+1];
  return `<section class="view"><div class="row" style="justify-content:space-between;margin:0"><a class="btn ghost small" href="#gym" style="text-decoration:none">← Gym</a><span><b>${i+1}</b> / ${PROBLEMS.length}</span></div>
  <div class="card challenge"><div class="row" style="margin:0"><span class="pid" style="background:${DCOLOR[p.diff]}">${p.id}</span><span class="pill">${p.diff} · 💎 ${DIFF_GEMS[p.diff]}</span>${p.tags.map(t => `<span class="pill" style="font-weight:700">${t}</span>`).join('')}${S.gym[p.id] ? '<span class="pill" style="background:#e3fbef">✅ Solved</span>' : ''}</div>
    <h2 style="margin:10px 0 6px">${esc(p.title)}</h2><p style="font-size:17px">${p.prompt}</p>
    <div class="play"><div><textarea class="editor" id="pEditor" spellcheck="false">${esc(S.tries['p'+id] || '-- Write your query here\n')}</textarea>
    <div class="row"><button class="btn mint small" id="pRun">▶ Run</button><button class="btn small" id="pCheck">✓ Check</button><button class="btn ghost small" id="pHint">💡 Hint</button><button class="btn ghost small" id="pSol" style="display:${(S.tries[id]||0) >= 2 || S.gym[p.id] ? 'inline-block' : 'none'}">👀 Solution</button><span class="kbd">Ctrl/⌘+Enter = check</span></div>
    <div id="pMsg" style="margin-top:8px;font-weight:800"></div><div id="pOut"></div></div>${schemaHTML()}</div></div>
  <div class="row" style="justify-content:space-between">${prev ? `<a class="btn ghost small" href="#p-${prev.id}" style="text-decoration:none">← ${prev.id}</a>` : '<span></span>'}${next ? `<a class="btn ghost small" href="#p-${next.id}" style="text-decoration:none">${next.id}: ${esc(next.title)} →</a>` : '<a class="btn small" href="#mock" style="text-decoration:none">⏱️ Try the mock interview →</a>'}</div></section>`;
}
function wireProblem(id){
  const p = PROBLEMS.find(x => x.id === id); if(!p) return; const ed = $('#pEditor');
  ed.addEventListener('input', () => { S.tries['p'+id] = ed.value; save(); });
  ed.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); $('#pCheck').click(); } });
  $('#pRun').onclick = () => renderResult($('#pOut'), ed.value);
  $('#pHint').onclick = () => { $('#pMsg').innerHTML = `💡 <span style="font-weight:700">${esc(p.hint)}</span>`; };
  $('#pSol').onclick = () => { ed.value = p.solution.replace(/ (FROM|WHERE|JOIN|LEFT JOIN|GROUP BY|ORDER BY|HAVING|SELECT|UNION ALL)\b/g, '\n$1').replace(/\n(JOIN|LEFT JOIN)/g, '\n  $1'); $('#pMsg').innerHTML = '👀 One possible solution. Run it, then try writing it yourself from memory!'; };
  $('#pCheck').onclick = async () => { await dbReady; renderResult($('#pOut'), ed.value); const r = checkAnswer(ed.value, p);
    if(r.ok){ $('#pMsg').innerHTML = '<span style="color:#2a9d74">🎉 Correct! Interview-ready move.</span>'; if(!S.gym[id]){ S.gym[id] = Date.now(); addGems(DIFF_GEMS[p.diff]); confetti(50); } save(); $('#pSol').style.display = 'inline-block'; }
    else { S.tries[id] = (S.tries[id]||0) + 1; save(); $('#pMsg').innerHTML = `<span style="color:#c0566e">🤔 ${r.msg}</span>`; if(S.tries[id] >= 2) $('#pSol').style.display = 'inline-block'; } };
}
// ---------- Mock interview ----------
let MOCK = null;
function viewMock(){
  if(!MOCK || MOCK.ended) return `<section class="view"><div class="ch-head" style="background:linear-gradient(135deg,#fff0d6,#ffd6e0)">${art('trophy','#fff0d6')}<div><div class="kicker">Mock interview</div><h1>4 questions · 25 minutes</h1><div class="sub">1 easy, 2 medium and 1 hard, picked at random from the gym. Talk through your thinking out loud as if an interviewer is listening.</div></div></div>
    ${MOCK && MOCK.ended ? mockResults() : ''}
    <div class="card"><h2 style="margin:0 0 6px">How it works</h2><ul><li>A timer runs for 25 minutes. Use the <b>5-step method</b> from Chapter 16.</li><li>Check answers as often as you like. Solutions appear only at the end.</li><li>Each solved question earns 💎 30.</li></ul>${S.mock ? `<p>Your best: <b>${S.mock.score}/4</b> on ${esc(S.mock.date)}</p>` : ''}<button class="btn" id="mStart">⏱️ Start mock interview</button></div></section>`;
  const q = PROBLEMS.find(p => p.id === MOCK.ids[MOCK.cur]);
  return `<section class="view"><div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><b>⏱️ <span id="mT">--:--</span></b>${MOCK.ids.map((id, i) => `<button class="btn ${i === MOCK.cur ? '' : 'ghost'} small" data-q="${i}">Q${i+1} ${MOCK.solved[id] ? '✅' : ''}</button>`).join('')}<span style="flex:1"></span><button class="btn ghost small" id="mEnd">Finish interview</button></div>
    <div class="card challenge"><div class="row" style="margin:0"><span class="pill">${q.diff}</span>${q.tags.map(t => `<span class="pill">${t}</span>`).join('')}</div><h2 style="margin:8px 0">Q${MOCK.cur+1}. ${esc(q.title)}</h2><p style="font-size:17px">${q.prompt}</p>
    <div class="play"><div><textarea class="editor" id="mEd" spellcheck="false">${esc(MOCK.code[q.id] || '-- Clarify, plan, then write it here\n')}</textarea><div class="row"><button class="btn mint small" id="mRun">▶ Run</button><button class="btn small" id="mCheck">✓ Check</button></div><div id="mMsg" style="font-weight:800"></div><div id="mOut"></div></div>${schemaHTML()}</div></div></section>`;
}
function mockResults(){
  const n = MOCK.ids.filter(id => MOCK.solved[id]).length; const mins = Math.round((Math.min(Date.now(), MOCK.endAt) - MOCK.startAt) / 60000);
  return `<div class="card" style="text-align:center"><div style="font-size:60px">${n === 4 ? '🏆' : n >= 2 ? '🌟' : '💪'}</div><h2>You solved ${n} of 4 in ${mins} min</h2><p>${n === 4 ? 'Interview-ready! Try another round to keep it sharp.' : n >= 2 ? 'Solid! Review the solutions below, then try again tomorrow.' : 'Every attempt builds the muscle. Review the solutions and practise those topics in the gym.'}</p></div>
  ${MOCK.ids.map((id, i) => { const p = PROBLEMS.find(x => x.id === id); return `<div class="card"><b>Q${i+1}. ${esc(p.title)} ${MOCK.solved[id] ? '✅' : '❌'}</b><p>${p.prompt}</p>${MOCK.solved[id] ? '' : `<pre class="sqlc" style="padding-right:18px">${hl(p.solution)}</pre>`}<a href="#p-${p.id}">Practise this in the gym →</a></div>`; }).join('')}`;
}
let mockIv = null;
function wireMock(){
  clearInterval(mockIv);
  const st = $('#mStart'); if(st){ st.onclick = () => { const pick = d => PROBLEMS.filter(p => p.diff === d).sort(() => Math.random() - .5);
      MOCK = { ids:[pick('Easy')[0].id, ...pick('Medium').slice(0,2).map(p => p.id), pick('Hard')[0].id], cur:0, solved:{}, code:{}, startAt:Date.now(), endAt:Date.now() + 25*60000, ended:false }; route(); }; return; }
  const q = PROBLEMS.find(p => p.id === MOCK.ids[MOCK.cur]); const ed = $('#mEd');
  const finish = () => { if(MOCK.ended) return; MOCK.ended = true; clearInterval(mockIv); const n = MOCK.ids.filter(id => MOCK.solved[id]).length;
    if(!S.mock || n > S.mock.score) S.mock = { score:n, date:new Date().toLocaleDateString() }; save(); if(n) confetti(40 + n*20); route(); };
  const tick = () => { const left = Math.max(0, MOCK.endAt - Date.now()); const t = $('#mT'); if(!t){ clearInterval(mockIv); return; } t.textContent = `${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`; t.style.color = left < 120000 ? '#c0566e' : ''; if(left <= 0) finish(); };
  mockIv = setInterval(tick, 1000); tick();
  ed.addEventListener('input', () => { MOCK.code[q.id] = ed.value; });
  ed.addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); $('#mCheck').click(); } });
  $$('[data-q]').forEach(b => b.onclick = () => { MOCK.code[q.id] = ed.value; MOCK.cur = +b.dataset.q; route(); });
  $('#mRun').onclick = () => renderResult($('#mOut'), ed.value, true);
  $('#mCheck').onclick = async () => { await dbReady; renderResult($('#mOut'), ed.value, true); const r = checkAnswer(ed.value, q);
    if(r.ok){ if(!MOCK.solved[q.id]){ MOCK.solved[q.id] = true; addGems(30); } $('#mMsg').innerHTML = '<span style="color:#2a9d74">✅ Correct! On to the next one.</span>'; $$('[data-q]')[MOCK.cur].textContent = `Q${MOCK.cur+1} ✅`; if(MOCK.ids.every(id => MOCK.solved[id])) setTimeout(finish, 800); }
    else $('#mMsg').innerHTML = `<span style="color:#c0566e">🤔 ${r.msg}</span>`; };
  $('#mEnd').onclick = finish;
}

// ---------- router ----------
function route(){
  clearInterval(mockIv);
  const h = (location.hash || '#home').slice(1); const main = $('main'); let html, after = null;
  let m;
  if((m = h.match(/^ch-(\d+)$/))){ const id = +m[1]; html = viewChapter(id); after = () => wireChapter(id); }
  else if((m = h.match(/^game-(\d+)$/))){ const id = +m[1]; html = viewGame(id); after = () => wireGame(id); }
  else if(h === 'cheatsheet'){ html = viewCheat(); after = () => wirePlayground(); }
  else if(h === 'gym'){ html = viewGym(); after = wireGym; }
  else if((m = h.match(/^p-(\w+)$/))){ const id = m[1]; html = viewProblem(id); after = () => wireProblem(id); }
  else if(h === 'mock'){ html = viewMock(); after = wireMock; }
  else html = viewHome();
  main.innerHTML = html; window.scrollTo({top:0});
  $$('.nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + h || (h.startsWith('ch-') && a.dataset.k === 'learn') || (h.startsWith('p-') && a.getAttribute('href') === '#gym')));
  if(after) after(); reveal(main); updateTop();
}
window.addEventListener('hashchange', route);

// ---------- settings / welcome ----------
function settings(){
  modal(`<h2>⚙️ Your progress</h2><p>Progress saves in this browser. Copy this code to move it to another device or keep a backup.</p>
    <textarea id="bk" readonly>${btoa(unescape(encodeURIComponent(JSON.stringify(S))))}</textarea>
    <div class="row" style="justify-content:center"><button class="btn small" id="cp">Copy code</button></div>
    <p style="margin-top:16px">Restore from a code:</p><textarea id="rs" placeholder="Paste a backup code here"></textarea>
    <div class="row" style="justify-content:center"><button class="btn mint small" id="rsgo">Restore</button><button class="btn ghost small" id="rename">Change name</button><button class="btn ghost small" id="wipe">Reset everything</button></div><div id="sm" style="font-weight:800;margin-top:8px"></div>`, bg => {
    $('#cp', bg).onclick = async () => { try{ await navigator.clipboard.writeText($('#bk', bg).value); $('#sm', bg).textContent = 'Copied!'; }catch(e){ $('#bk', bg).select(); $('#sm', bg).textContent = 'Select the text above and copy it.'; } };
    $('#rsgo', bg).onclick = () => { try{ S = Object.assign({name:"",gems:0,done:{},quiz:{},solved:{},games:{},tries:{},gym:{},mock:null}, JSON.parse(decodeURIComponent(escape(atob($('#rs', bg).value.trim()))))); save(); bg.remove(); route(); toast('Progress restored!'); }catch(e){ $('#sm', bg).textContent = "That code didn't work."; } };
    $('#rename', bg).onclick = () => { bg.remove(); welcome(); };
    let armed = false; $('#wipe', bg).onclick = e => { if(!armed){ armed = true; e.target.textContent = 'Tap again to confirm'; return; } S = {name:S.name,gems:0,done:{},quiz:{},solved:{},games:{},tries:{},gym:{},mock:null}; save(); bg.remove(); route(); toast('Fresh start!'); };
  });
}
function welcome(){
  modal(`${lumiSVG('sm')}<h2>Hi, I'm Lumi! 👋</h2><p>I'll be your guide through SQL Quest. What should I call you?</p><input id="nm" class="bigin" style="width:100%;font-size:20px" placeholder="Your name" value="${esc(S.name)}"><div class="row" style="justify-content:center"><button class="btn" id="go">Let's go!</button></div>`, bg => {
    const go = () => { S.name = $('#nm', bg).value.trim().slice(0, 40); save(); bg.remove(); route(); };
    $('#go', bg).onclick = go; $('#nm', bg).onkeydown = e => { if(e.key === 'Enter') go(); }; setTimeout(() => $('#nm', bg).focus(), 50);
  });
}

// ---------- boot ----------
document.addEventListener('DOMContentLoaded', () => {
  const b = $('.bubbles'); for(let i=0;i<18;i++){ const s = document.createElement('span'); const z = 10 + Math.random()*40; s.style.width = s.style.height = z + 'px'; s.style.left = Math.random()*100 + '%'; s.style.animationDuration = (14 + Math.random()*18) + 's'; s.style.animationDelay = (-Math.random()*20) + 's'; b.appendChild(s); }
  $('#settingsBtn').onclick = settings;
  route();
  if(!S.name) setTimeout(welcome, 500);
});
})();
</script>
</body></html>
